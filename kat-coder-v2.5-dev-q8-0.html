<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CS 1.6 - de_dust2 Prototype</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
canvas { display: block; }

#crosshair {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none; z-index: 10;
}
#crosshair div { position: absolute; background: #0f0; }
#ch-top    { width: 2px; height: 10px; left: -1px; top: -16px; }
#ch-bottom { width: 2px; height: 10px; left: -1px; top: 6px; }
#ch-left   { width: 10px; height: 2px; left: -16px; top: -1px; }
#ch-right  { width: 10px; height: 2px; left: 6px; top: -1px; }
#ch-dot { width: 2px; height: 2px; left: -1px; top: -1px; background: #0f0; }

#hud {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 60px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 30px; z-index: 10; color: #fff;
  font-size: 22px; text-shadow: 1px 1px 2px #000;
  border-top: 2px solid rgba(255,255,255,0.1);
}
#hud .hud-left { display: flex; align-items: center; gap: 20px; }
#hud .hud-right { display: flex; align-items: center; gap: 20px; }
.hud-label { color: #aaa; font-size: 14px; }
.hud-value { font-size: 28px; font-weight: bold; }
.hp-val { color: #4f4; }
.ammo-val { color: #ff4; }

#health-bar-container {
  width: 120px; height: 8px; background: rgba(255,255,255,0.2);
  border-radius: 4px; overflow: hidden;
}
#health-bar {
  width: 100%; height: 100%; background: linear-gradient(90deg, #f44, #4f4);
  transition: width 0.3s;
}

#hit-marker {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none; z-index: 11;
  opacity: 0; transition: opacity 0.1s;
}
#hit-marker.show { opacity: 1; }
#hit-marker div { position: absolute; background: #fff; }
.hm1 { width: 2px; height: 12px; transform: rotate(45deg); left: 5px; top: -6px; }
.hm2 { width: 2px; height: 12px; transform: rotate(-45deg); left: -7px; top: -6px; }
.hm3 { width: 2px; height: 12px; transform: rotate(45deg); left: 5px; top: -6px; }
.hm4 { width: 2px; height: 12px; transform: rotate(-45deg); left: 5px; top: 6px; }

#damage-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 9;
  border: 0px solid rgba(255,0,0,0);
  transition: border 0.1s;
}
#damage-overlay.hit { border: 15px solid rgba(255,0,0,0.4); }

#start-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85); z-index: 100;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; color: #fff;
}
#start-screen h1 { font-size: 48px; color: #d2b48c; margin-bottom: 10px; }
#start-screen h2 { font-size: 24px; color: #aaa; margin-bottom: 30px; }
#start-screen .controls { font-size: 14px; color: #888; line-height: 2; text-align: center; }
#start-screen .start-btn {
  margin-top: 30px; padding: 15px 50px; font-size: 22px;
  background: #d2b48c; color: #000; border: none; cursor: pointer;
  font-family: 'Courier New', monospace; font-weight: bold;
  transition: background 0.2s;
}
#start-screen .start-btn:hover { background: #c2a677; }

#kill-feed {
  position: fixed; top: 20px; right: 20px; z-index: 10;
  display: flex; flex-direction: column; gap: 5px;
}
.kill-msg {
  background: rgba(0,0,0,0.6); color: #fff; padding: 5px 12px;
  font-size: 13px; border-radius: 3px;
  animation: fadeOut 3s forwards;
}
@keyframes fadeOut { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

#minimap {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  width: 150px; height: 150px;
  background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3);
  border-radius: 5px;
}
#minimap-canvas { width: 150px; height: 150px; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>DE_DUST2</h1>
  <h2>FPS Prototype</h2>
  <div class="controls">
    <strong>WASD</strong> — Move &nbsp;|&nbsp; <strong>MOUSE</strong> — Look<br>
    <strong>LEFT CLICK</strong> — Shoot &nbsp;|&nbsp; <strong>SPACE</strong> — Jump<br>
    <strong>R</strong> — Reload &nbsp;|&nbsp; <strong>SHIFT</strong> — Walk
  </div>
  <button class="start-btn" id="start-btn">CLICK TO PLAY</button>
</div>

<div id="crosshair">
  <div id="ch-dot"></div>
  <div id="ch-top"></div>
  <div id="ch-bottom"></div>
  <div id="ch-left"></div>
  <div id="ch-right"></div>
</div>

<div id="hit-marker">
  <div class="hm1"></div><div class="hm2"></div>
  <div class="hm3"></div><div class="hm4"></div>
</div>

<div id="damage-overlay"></div>

<div id="kill-feed"></div>

<canvas id="minimap-canvas" width="150" height="150"></canvas>

<div id="hud">
  <div class="hud-left">
    <div>
      <div class="hud-label">HEALTH</div>
      <div id="health-bar-container"><div id="health-bar"></div></div>
      <div class="hud-value hp-val" id="hp-text">100</div>
    </div>
    <div>
      <div class="hud-label">ARMOR</div>
      <div class="hud-value" style="color:#48f" id="armor-text">0</div>
    </div>
  </div>
  <div class="hud-right">
    <div style="text-align:center">
      <div class="hud-label">AK-47</div>
      <div class="hud-value ammo-val" id="ammo-text">30 / 90</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  CS 1.6 DE_DUST2 - FPS PROTOTYPE
// ============================================================

// --- GLOBALS ---
let scene, camera, renderer, clock;
let player = { hp: 100, armor: 0, ammo: 30, reserve: 90, speed: 8, walkSpeed: 4, jumpForce: 8, onGround: true };
let velocity = new THREE.Vector3();
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let canJump = false, isWalking = false;
let euler = new THREE.Euler(0, 0, 0, 'YXZ');
let isLocked = false;
let weaponGroup, weaponBob = 0, weaponRecoil = 0;
let lastShotTime = 0, fireRate = 100; // ms between shots
let reloadTime = 0, isReloading = false;
let bullets = [];
let enemies = [];
let decals = [];
let colliders = [];
let audioCtx;
let raycaster = new THREE.Raycaster();

// Map dimensions
const MAP_W = 200, MAP_D = 200;
const WALL_H = 4;
const PLAYER_H = 1.7;
const PLAYER_R = 0.4;

// --- INIT ---
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 60, 180);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, PLAYER_H, 0);

  renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = false;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // Audio
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Lights
  const ambient = new THREE.AmbientLight(0xffeedd, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.9);
  sun.position.set(50, 80, 30);
  scene.add(sun);
  const hemi = new THREE.HemisphereLight(0x87CEEB, 0xd2b48c, 0.3);
  scene.add(hemi);

  buildMap();
  buildWeapon();
  spawnEnemies();
  setupControls();

  window.addEventListener('resize', onResize);
  animate();
}

// --- TEXTURE GENERATION ---
function createCanvasTexture(w, h, drawFn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  drawFn(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function sandTexture() {
  return createCanvasTexture(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#d2b48c';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 3000; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const g = 160 + Math.random() * 60;
      ctx.fillStyle = `rgb(${g},${g-40},${g-80})`;
      ctx.fillRect(x, y, 2, 2);
    }
  });
}

function darkSandTexture() {
  return createCanvasTexture(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#c2a677';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 2000; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const g = 140 + Math.random() * 50;
      ctx.fillStyle = `rgb(${g},${g-30},${g-60})`;
      ctx.fillRect(x, y, 2, 2);
    }
  });
}

function crateTexture() {
  return createCanvasTexture(128, 128, (ctx, w, h) => {
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#5a4510';
    ctx.lineWidth = 3;
    ctx.strokeRect(4, 4, w-8, h-8);
    ctx.beginPath();
    ctx.moveTo(4, 4); ctx.lineTo(w-4, h-4);
    ctx.moveTo(w-4, 4); ctx.lineTo(4, h-4);
    ctx.stroke();
    ctx.fillStyle = '#6b5210';
    ctx.fillRect(w/2-2, 4, 4, h-8);
    ctx.fillRect(4, h/2-2, w-8, 4);
  });
}

function floorTexture() {
  return createCanvasTexture(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#c4a265';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 4000; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const g = 150 + Math.random() * 70;
      ctx.fillStyle = `rgba(${g},${g-30},${g-60},0.5)`;
      ctx.fillRect(x, y, 1 + Math.random()*2, 1 + Math.random()*2);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 64) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for (let y = 0; y < h; y += 64) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  });
}

const sandTex = sandTexture();
const darkSandTex = darkSandTexture();
const crateTex = crateTexture();
const floorTex = floorTexture();
floorTex.repeat.set(20, 20);

// --- MAP BUILDING ---
function addBox(w, h, d, x, y, z, color, texture, castShadow = false) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshLambertMaterial({ map: texture || color });
  if (texture) mat.map = texture;
  else mat.color = color;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  colliders.push({
    min: new THREE.Vector3(x - w/2, y - h/2, z - d/2),
    max: new THREE.Vector3(x + w/2, y + h/2, z + d/2)
  });
  return mesh;
}

function buildMap() {
  // Ground
  const groundGeo = new THREE.PlaneGeometry(MAP_W, MAP_D);
  const groundMat = new THREE.MeshLambertMaterial({ map: floorTex });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  scene.add(ground);

  // Sky dome
  const skyGeo = new THREE.SphereGeometry(250, 16, 16);
  const skyMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  const ST = sandTex, DST = darkSandTex;
  const W = WALL_H;

  // ===== OUTER WALLS =====
  addBox(MAP_W, W, 2, 0, W/2, -MAP_D/2, null, ST); // North
  addBox(MAP_W, W, 2, 0, W/2, MAP_D/2, null, ST);  // South
  addBox(2, W, MAP_D, -MAP_W/2, W/2, 0, null, ST); // West
  addBox(2, W, MAP_D, MAP_W/2, W/2, 0, null, DST); // East

  // ===== DUST2 LAYOUT (simplified) =====
  // Center area coordinates: origin is center of map

  // --- LONG A (right side, going up) ---
  addBox(2, W, 40, 35, W/2, -30, null, ST); // Long wall left
  addBox(2, W, 40, 50, W/2, -30, null, ST); // Long wall right
  addBox(17, W, 2, 42.5, W/2, -50, null, ST); // Long end wall
  addBox(17, W, 2, 42.5, W/2, -10, null, ST); // Long mid wall

  // --- A SITE ---
  addBox(20, W, 2, 30, W/2, -60, null, ST); // A site back
  addBox(2, W, 20, 40, W/2, -60, null, ST); // A site right
  addBox(2, W, 20, 20, W/2, -60, null, ST); // A site left
  addBox(20, W, 2, 30, W/2, -50, null, ST); // A site front partial
  addBox(2, W, 10, 20, W/2, -55, null, ST); // A site inner wall

  // --- A DOORS ---
  addBox(8, W, 2, 15, W/2, -50, null, DST); // A doors wall left
  addBox(8, W, 2, 15, W/2, -50, null, DST); // placeholder

  // --- MID ---
  addBox(2, W, 30, 0, W/2, -20, null, ST); // Mid left wall
  addBox(2, W, 30, 10, W/2, -20, null, ST); // Mid right wall
  addBox(12, W, 2, 5, W/2, -5, null, ST); // Mid connector

  // --- T SPAWN area ---
  addBox(30, W, 2, -20, W/2, 40, null, ST); // T spawn back
  addBox(2, W, 20, -35, W/2, 30, null, ST); // T spawn left
  addBox(2, W, 20, -5, W/2, 30, null, ST); // T spawn right

  // --- CT SPAWN ---
  addBox(2, W, 20, -40, W/2, -40, null, DST); // CT spawn area

  // --- BANanas (between mid and A) ---
  addBox(2, W, 15, 15, W/2, -35, null, ST);
  addBox(2, W, 15, 15, W/2, -20, null, ST);

  // --- PYRAMID ---
  addBox(10, W, 2, -15, W/2, -10, null, ST);
  addBox(2, W, 10, -20, W/2, -15, null, ST);

  // --- CONNECTORS ---
  addBox(2, W, 20, -10, W/2, 0, null, ST);
  addBox(2, W, 20, 25, W/2, 0, null, ST);
  addBox(10, W, 2, 7.5, W/2, 10, null, ST);

  // --- BOTTOM A / RAT TUNNEL area ---
  addBox(2, W, 25, -30, W/2, -45, null, ST);
  addBox(2, W, 25, -30, W/2, -20, null, ST);
  addBox(10, W, 2, -25, W/2, -32.5, null, ST);

  // --- CRATES (cover objects) ---
  const cratePositions = [
    // Long A
    { x: 38, z: -35, s: 2 }, { x: 45, z: -40, s: 2 },
    { x: 42, z: -25, s: 1.5 },
    // A site
    { x: 25, z: -55, s: 2 }, { x: 35, z: -58, s: 2 },
    { x: 28, z: -52, s: 1.5 },
    // Mid
    { x: 3, z: -15, s: 2 }, { x: 8, z: -10, s: 1.5 },
    // T spawn
    { x: -25, z: 35, s: 2 }, { x: -15, z: 38, s: 2 },
    { x: -20, z: 30, s: 1.5 },
    // B area (bottom)
    { x: -10, z: 20, s: 2 }, { x: -5, z: 25, s: 2 },
    { x: 0, z: 15, s: 1.5 },
    // Connector
    { x: 18, z: -42, s: 2 },
    { x: -28, z: -35, s: 2 },
  ];

  cratePositions.forEach(c => {
    const geo = new THREE.BoxGeometry(c.s, c.s, c.s);
    const mat = new THREE.MeshLambertMaterial({ map: crateTex });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(c.x, c.s/2, c.z);
    scene.add(mesh);
    colliders.push({
      min: new THREE.Vector3(c.x - c.s/2, 0, c.z - c.s/2),
      max: new THREE.Vector3(c.x + c.s/2, c.s, c.z + c.s/2)
    });
  });

  // --- Additional detail walls for depth ---
  // Ramp to upper mid
  addBox(6, 0.5, 10, 5, 1.5, -30, null, DST);
  addBox(6, 3, 0.5, 5, 3, -35, null, ST);

  // Small cover walls
  addBox(4, W * 0.6, 0.5, -8, W * 0.3, 5, null, DST);
  addBox(0.5, W * 0.6, 4, -12, W * 0.3, 8, null, DST);
}

// --- WEAPON ---
function buildWeapon() {
  weaponGroup = new THREE.Group();

  const metalMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
  const woodMat = new THREE.MeshLambertMaterial({ color: 0x8B6914 });
  const darkMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });

  // Receiver
  const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.45), metalMat);
  receiver.position.set(0, 0, 0);
  weaponGroup.add(receiver);

  // Barrel
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.018, 0.4, 8), darkMat);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.01, -0.42);
  weaponGroup.add(barrel);

  // Barrel shroud (gas block area)
  const shroud = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.2), woodMat);
  shroud.position.set(0, 0.01, -0.35);
  weaponGroup.add(shroud);

  // Magazine (curved)
  const magGeo = new THREE.BoxGeometry(0.04, 0.18, 0.08);
  const mag = new THREE.Mesh(magGeo, darkMat);
  mag.position.set(0, -0.12, 0.05);
  mag.rotation.x = 0.15;
  weaponGroup.add(mag);

  // Stock
  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.25), woodMat);
  stock.position.set(0, -0.01, 0.35);
  weaponGroup.add(stock);

  // Stock butt
  const butt = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.04), woodMat);
  butt.position.set(0, -0.01, 0.48);
  weaponGroup.add(butt);

  // Grip
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.04), woodMat);
  grip.position.set(0, -0.08, 0.15);
  grip.rotation.x = -0.2;
  weaponGroup.add(grip);

  // Handguard
  const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, 0.15), woodMat);
  handguard.position.set(0, 0.01, -0.18);
  weaponGroup.add(handguard);

  // Sight
  const sightBase = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.03, 0.02), metalMat);
  sightBase.position.set(0, 0.065, -0.05);
  weaponGroup.add(sightBase);
  const sightFront = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.04, 0.01), metalMat);
  sightFront.position.set(0, 0.085, -0.25);
  weaponGroup.add(sightFront);

  // Muzzle
  const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 0.03, 8), darkMat);
  muzzle.rotation.x = Math.PI / 2;
  muzzle.position.set(0, 0.01, -0.63);
  weaponGroup.add(muzzle);

  // Position weapon in bottom-right of screen
  weaponGroup.position.set(0.25, -0.22, -0.5);
  weaponGroup.rotation.set(0, 0, 0);
  camera.add(weaponGroup);
  scene.add(camera);
}

// --- ENEMIES ---
function spawnEnemies() {
  const positions = [
    { x: 30, z: -50 },
    { x: 5, z: -15 },
    { x: -20, z: 35 },
    { x: 18, z: -42 },
    { x: -10, z: 20 },
  ];

  positions.forEach((p, i) => {
    createEnemy(p.x, p.z, i);
  });
}

function createEnemy(x, z, index) {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.4, 12);
  const bodyMat = new THREE.MeshLambertMaterial({ color: index % 2 === 0 ? 0x4466cc : 0xcc4444 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.7;
  group.add(body);

  // Head
  const headGeo = new THREE.SphereGeometry(0.25, 12, 12);
  const headMat = new THREE.MeshLambertMaterial({ color: 0xddaa77 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.6;
  group.add(head);

  // Legs
  const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.6, 8);
  const legMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
  const leftLeg = new THREE.Mesh(legGeo, legMat);
  leftLeg.position.set(-0.15, 0.3, 0);
  group.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, legMat);
  rightLeg.position.set(0.15, 0.3, 0);
  group.add(rightLeg);

  // Arms
  const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.7, 8);
  const leftArm = new THREE.Mesh(armGeo, bodyMat);
  leftArm.position.set(-0.45, 0.9, 0);
  group.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, bodyMat);
  rightArm.position.set(0.45, 0.9, 0);
  group.add(rightArm);

  group.position.set(x, 0, z);
  scene.add(group);

  // Health bar (sprite)
  const hpCanvas = document.createElement('canvas');
  hpCanvas.width = 64; hpCanvas.height = 8;
  const hpTex = new THREE.CanvasTexture(hpCanvas);
  const hpMat = new THREE.SpriteMaterial({ map: hpTex, transparent: true });
  const hpBar = new THREE.Sprite(hpMat);
  hpBar.position.set(0, 2.2, 0);
  hpBar.scale.set(1, 0.12, 1);
  group.add(hpBar);

  enemies.push({
    mesh: group,
    hp: 100,
    maxHp: 100,
    speed: 2 + Math.random() * 2,
    lastShot: 0,
    fireRate: 1500 + Math.random() * 1000,
    hpBar: hpBar,
    hpCanvas: hpCanvas,
    hpCtx: hpCanvas.getContext('2d'),
    hpTex: hpTex,
    alive: true,
    respawnTimer: 0,
    index: index
  });
}

function updateEnemyHP(enemy) {
  const ctx = enemy.hpCtx;
  const c = enemy.hpCanvas;
  ctx.clearRect(0, 0, c.width, c.height);
  const ratio = enemy.hp / enemy.maxHp;
  ctx.fillStyle = ratio > 0.5 ? '#0f0' : ratio > 0.25 ? '#ff0' : '#f00';
  ctx.fillRect(0, 0, c.width * ratio, c.height);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 0, c.width, c.height);
  enemy.hpTex.needsUpdate = true;
}

function damageEnemy(enemy, damage) {
  if (!enemy.alive) return;
  enemy.hp -= damage;
  updateEnemyHP(enemy);
  if (enemy.hp <= 0) {
    enemy.alive = false;
    enemy.respawnTimer = 5;
    scene.remove(enemy.mesh);
    addKillFeed(enemy.index);
  }
}

function respawnEnemy(enemy, dt) {
  enemy.respawnTimer -= dt;
  if (enemy.respawnTimer <= 0) {
    enemy.alive = true;
    enemy.hp = enemy.maxHp;
    // Random position
    const positions = [
      { x: 30, z: -50 }, { x: 5, z: -15 }, { x: -20, z: 35 },
      { x: 18, z: -42 }, { x: -10, z: 20 }, { x: -25, z: -35 }
    ];
    const p = positions[enemy.index % positions.length];
    enemy.mesh.position.set(p.x, 0, p.z);
    scene.add(enemy.mesh);
    updateEnemyHP(enemy);
  }
}

function addKillFeed(enemyIndex) {
  const feed = document.getElementById('kill-feed');
  const msg = document.createElement('div');
  msg.className = 'kill-msg';
  msg.innerHTML = `<span style="color:#4af">You</span> 🔫 <span style="color:#f44">Bot ${enemyIndex + 1}</span>`;
  feed.appendChild(msg);
  setTimeout(() => msg.remove(), 3500);
}

// --- AUDIO ---
function playGunshot() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  // Noise burst
  const bufferSize = audioCtx.sampleRate * 0.1;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(3000, now);
  filter.frequency.exponentialRampToValueAtTime(300, now + 0.1);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.4, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(now);
  noise.stop(now + 0.15);

  // Low thump
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
  const oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(0.3, now);
  oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
  osc.connect(oscGain);
  oscGain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.08);
}

function playHitSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, now);
  osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}

function playReloadSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  [0, 0.2, 0.4].forEach((delay, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600 + i * 200, now + delay);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.1, now + delay);
    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + delay);
    osc.stop(now + delay + 0.1);
  });
}

// --- BULLET DECALS ---
function addDecal(position, normal) {
  const geo = new THREE.PlaneGeometry(0.15, 0.15);
  const mat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position).add(normal.multiplyScalar(0.01));
  mesh.lookAt(position.clone().add(normal));
  scene.add(mesh);
  decals.push({ mesh, time: 3 });
}

// --- CONTROLS ---
function setupControls() {
  const startBtn = document.getElementById('start-btn');
  startBtn.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === renderer.domElement;
    document.getElementById('start-screen').style.display = isLocked ? 'none' : 'flex';
  });

  document.addEventListener('mousemove', (e) => {
    if (!isLocked) return;
    const sensitivity = 0.002;
    euler.setFromQuaternion(camera.quaternion);
    euler.y -= e.movementX * sensitivity;
    euler.x -= e.movementY * sensitivity;
    euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
    camera.quaternion.setFromEuler(euler);
  });

  document.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'KeyW': moveForward = true; break;
      case 'KeyS': moveBackward = true; break;
      case 'KeyA': moveLeft = true; break;
      case 'KeyD': moveRight = true; break;
      case 'Space':
        if (player.onGround) { velocity.y = player.jumpForce; player.onGround = false; }
        break;
      case 'ShiftLeft': isWalking = true; break;
      case 'KeyR': reload(); break;
    }
  });

  document.addEventListener('keyup', (e) => {
    switch (e.code) {
      case 'KeyW': moveForward = false; break;
      case 'KeyS': moveBackward = false; break;
      case 'KeyA': moveLeft = false; break;
      case 'KeyD': moveRight = false; break;
      case 'ShiftLeft': isWalking = false; break;
    }
  });

  document.addEventListener('mousedown', (e) => {
    if (!isLocked || e.button !== 0) return;
    shoot();
  });

  document.addEventListener('contextmenu', e => e.preventDefault());
}

function reload() {
  if (isReloading || player.ammo === 30 || player.reserve <= 0) return;
  isReloading = true;
  playReloadSound();
  // Animation: lower weapon
  const startRot = weaponGroup.rotation.x;
  const startTime = clock.getElapsedTime();
  const reloadDuration = 2.0;

  function reloadAnim() {
    const elapsed = clock.getElapsedTime() - startTime;
    const t = Math.min(elapsed / reloadDuration, 1);
    if (t < 0.3) {
      weaponGroup.rotation.x = -0.5 * (t / 0.3);
    } else if (t < 0.7) {
      weaponGroup.rotation.x = -0.5;
    } else {
      weaponGroup.rotation.x = -0.5 * (1 - (t - 0.7) / 0.3);
    }
    if (t < 1) {
      requestAnimationFrame(reloadAnim);
    } else {
      weaponGroup.rotation.x = 0;
      const needed = 30 - player.ammo;
      const available = Math.min(needed, player.reserve);
      player.ammo += available;
      player.reserve -= available;
      isReloading = false;
      updateHUD();
    }
  }
  reloadAnim();
}

// --- SHOOTING ---
function shoot() {
  const now = performance.now();
  if (now - lastShotTime < fireRate || isReloading) return;
  if (player.ammo <= 0) {
    reload();
    return;
  }

  lastShotTime = now;
  player.ammo--;
  updateHUD();
  playGunshot();

  // Recoil
  weaponRecoil = 0.08;
  euler.setFromQuaternion(camera.quaternion);
  euler.x += 0.02;
  camera.quaternion.setFromEuler(euler);

  // Raycast
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  // Check enemies first
  let hitEnemy = false;
  enemies.forEach(enemy => {
    if (!enemy.alive) return;
    const intersects = raycaster.intersectObject(enemy.mesh, true);
    if (intersects.length > 0 && intersects[0].distance < 100) {
      const dmg = 25 + Math.random() * 15;
      damageEnemy(enemy, dmg);
      hitEnemy = true;
      playHitSound();
      showHitMarker();
    }
  });

  // Check environment
  if (!hitEnemy) {
    const allMeshes = [];
    scene.traverse(obj => {
      if (obj.isMesh && obj !== weaponGroup) allMeshes.push(obj);
    });
    const intersects = raycaster.intersectObjects(allMeshes, false);
    if (intersects.length > 0 && intersects[0].distance < 200) {
      const hit = intersects[0];
      addDecal(hit.point, hit.face.normal.clone());
    }
  }

  if (player.ammo <= 0 && player.reserve > 0) {
    setTimeout(() => reload(), 500);
  }
}

function showHitMarker() {
  const hm = document.getElementById('hit-marker');
  hm.classList.add('show');
  setTimeout(() => hm.classList.remove('show'), 150);
}

// --- COLLISION ---
function checkCollision(x, z, radius) {
  const px = x, pz = z;
  for (const c of colliders) {
    const closestX = Math.max(c.min.x, Math.min(px, c.max.x));
    const closestZ = Math.max(c.min.z, Math.min(pz, c.max.z));
    const dx = px - closestX, dz = pz - closestZ;
    if (dx * dx + dz * dz < radius * radius) {
      return true;
    }
  }
  return false;
}

// --- UPDATE ---
function update(dt) {
  if (!isLocked) return;
  dt = Math.min(dt, 0.05);

  // Movement
  const speed = isWalking ? player.walkSpeed : player.speed;
  const direction = new THREE.Vector3();
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  const right = new THREE.Vector3();
  right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

  if (moveForward) direction.add(forward);
  if (moveBackward) direction.sub(forward);
  if (moveLeft) direction.sub(right);
  if (moveRight) direction.add(right);
  if (direction.length() > 0) direction.normalize();

  velocity.x = direction.x * speed;
  velocity.z = direction.z * speed;

  // Gravity
  velocity.y -= 20 * dt;

  // Apply with collision
  const newX = camera.position.x + velocity.x * dt;
  const newZ = camera.position.z + velocity.z * dt;

  if (!checkCollision(newX, camera.position.z, PLAYER_R)) {
    camera.position.x = newX;
  }
  if (!checkCollision(camera.position.x, newZ, PLAYER_R)) {
    camera.position.z = newZ;
  }

  camera.position.y += velocity.y * dt;
  if (camera.position.y <= PLAYER_H) {
    camera.position.y = PLAYER_H;
    velocity.y = 0;
    player.onGround = true;
  }

  // Map bounds
  camera.position.x = Math.max(-MAP_W/2 + 1, Math.min(MAP_W/2 - 1, camera.position.x));
  camera.position.z = Math.max(-MAP_D/2 + 1, Math.min(MAP_D/2 - 1, camera.position.z));

  // Weapon bob
  if (direction.length() > 0 && player.onGround) {
    weaponBob += dt * (isWalking ? 4 : 8);
    const bobAmount = isWalking ? 0.008 : 0.015;
    weaponGroup.position.y = -0.22 + Math.sin(weaponBob) * bobAmount;
    weaponGroup.position.x = 0.25 + Math.cos(weaponBob * 0.5) * bobAmount * 0.5;
  } else {
    weaponGroup.position.y += (-0.22 - weaponGroup.position.y) * 5 * dt;
    weaponGroup.position.x += (0.25 - weaponGroup.position.x) * 5 * dt;
  }

  // Weapon recoil
  if (weaponRecoil > 0) {
    weaponRecoil *= Math.pow(0.001, dt);
    weaponGroup.rotation.x = -weaponRecoil;
    weaponGroup.position.z = -0.5 + weaponRecoil * 0.5;
  } else {
    weaponGroup.rotation.x *= 0.9;
    weaponGroup.position.z += (-0.5 - weaponGroup.position.z) * 10 * dt;
  }

  // Enemy AI
  enemies.forEach(enemy => {
    if (!enemy.alive) {
      respawnEnemy(enemy, dt);
      return;
    }
    const dx = camera.position.x - enemy.mesh.position.x;
    const dz = camera.position.z - enemy.mesh.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);

    // Move toward player
    if (dist > 3) {
      const nx = dx / dist, nz = dz / dist;
      const newX = enemy.mesh.position.x + nx * enemy.speed * dt;
      const newZ = enemy.mesh.position.z + nz * enemy.speed * dt;
      // Simple collision check for enemies
      let blocked = false;
      for (const c of colliders) {
        const cx = Math.max(c.min.x, Math.min(newX, c.max.x));
        const cz = Math.max(c.min.z, Math.min(newZ, c.max.z));
        if ((newX - cx) ** 2 + (newZ - cz) ** 2 < 0.5) { blocked = true; break; }
      }
      if (!blocked) {
        enemy.mesh.position.x = newX;
        enemy.mesh.position.z = newZ;
      }
    }

    // Face player
    enemy.mesh.lookAt(new THREE.Vector3(camera.position.x, enemy.mesh.position.y, camera.position.z));

    // Shoot at player
    const now = performance.now();
    if (dist < 40 && now - enemy.lastShot > enemy.fireRate) {
      enemy.lastShot = now;
      enemyShoot(enemy, dist);
    }

    // Animate legs
    const walkCycle = clock.getElapsedTime() * enemy.speed;
    enemy.mesh.children.forEach((child, i) => {
      if (i === 2 || i === 3) { // legs
        child.rotation.x = Math.sin(walkCycle + (i === 2 ? 0 : Math.PI)) * 0.4;
      }
    });
  });

  // Decals
  decals.forEach((d, i) => {
    d.time -= dt;
    if (d.time <= 0) {
      scene.remove(d.mesh);
      d.mesh.geometry.dispose();
      d.mesh.material.dispose();
      decals.splice(i, 1);
    }
  });

  // Minimap
  updateMinimap();
}

function enemyShoot(enemy, dist) {
  // Raycast from enemy to player
  const dir = new THREE.Vector3();
  dir.subVectors(camera.position, enemy.mesh.position).normalize();
  const enemyRay = new THREE.Raycaster(enemy.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), dir);
  const allMeshes = [];
  scene.traverse(obj => { if (obj.isMesh) allMeshes.push(obj); });
  const hits = enemyRay.intersectObjects(allMeshes, false);

  let hitPlayer = true;
  if (hits.length > 0 && hits[0].distance < dist) {
    hitPlayer = false;
  }

  if (hitPlayer) {
    const dmg = 5 + Math.random() * 10;
    player.hp -= dmg;
    player.hp = Math.max(0, player.hp);
    updateHUD();
    document.getElementById('damage-overlay').classList.add('hit');
    setTimeout(() => document.getElementById('damage-overlay').classList.remove('hit'), 200);
    if (player.hp <= 0) {
      player.hp = 100;
      camera.position.set(0, PLAYER_H, 0);
      velocity.set(0, 0, 0);
    }
  }
}

function updateMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 150, 150);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, 150, 150);

  const scale = 0.6;
  const cx = 75, cy = 75;
  const px = camera.position.x, pz = camera.position.z;

  // Draw walls as lines
  ctx.strokeStyle = 'rgba(200,180,140,0.5)';
  ctx.lineWidth = 1;
  colliders.forEach(c => {
    const x1 = cx + (c.min.x - px) * scale;
    const z1 = cy + (c.min.z - pz) * scale;
    const x2 = cx + (c.max.x - px) * scale;
    const z2 = cy + (c.max.z - pz) * scale;
    ctx.strokeRect(x1, z1, x2 - x1, z2 - z1);
  });

  // Draw enemies
  enemies.forEach(e => {
    if (!e.alive) return;
    const ex = cx + (e.mesh.position.x - px) * scale;
    const ez = cy + (e.mesh.position.z - pz) * scale;
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.arc(ex, ez, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw player
  ctx.fillStyle = '#4f4';
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();

  // Direction indicator
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  ctx.strokeStyle = '#4f4';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + forward.x * 12, cy + forward.z * 12);
  ctx.stroke();
}

function updateHUD() {
  document.getElementById('hp-text').textContent = Math.ceil(player.hp);
  document.getElementById('health-bar').style.width = player.hp + '%';
  document.getElementById('armor-text').textContent = player.armor;
  document.getElementById('ammo-text').textContent = `${player.ammo} / ${player.reserve}`;
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- GAME LOOP ---
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  update(dt);
  renderer.render(scene, camera);
}

// --- START ---
init();
</script>
</body>
